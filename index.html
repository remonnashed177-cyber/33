<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صيد الآيات — اللسان (يعقوب ٣)</title>
<style>
:root{--bg:#faf5ea;--fg:#2b2118;--card:#fff;--ac:#8a5a14;--mu:#7a6a58;--ln:#e4d8c2;--ok:#2e7d32;--no:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#17120d;--fg:#f3e9d8;--card:#241c14;--ac:#e0b45c;--mu:#b5a58f;--ln:#3a2e20}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;font-size:clamp(18px,1.7vw,28px);line-height:1.7}
#hd{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--ln);color:var(--ac);align-items:center;gap:10px}
#a{min-height:calc(100vh - 70px);padding:10px clamp(16px,5vw,80px) 24px}
button{font:inherit;background:var(--ac);color:var(--bg);border:0;border-radius:12px;padding:9px 18px;cursor:pointer}
button:disabled{opacity:.4}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
#hd button{padding:4px 12px;font-size:.9rem}
.sub{color:var(--mu);margin:4px 0 10px}
.ctr{text-align:center;padding-top:6vh}
.ctr .big{font-size:5rem}
.ctr h1{color:var(--ac);font-size:2.4rem;margin:0}
.row{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.vs{border-inline-start:4px solid var(--ac);padding:6px 12px;margin:12px auto;max-width:700px;text-align:start;background:color-mix(in srgb,var(--ac) 8%,transparent)}
.vs b{display:block;color:var(--ac);font-size:.9rem}
.tray{display:flex;gap:8px;flex-wrap:wrap;min-height:50px;margin-bottom:6px}
.chipx{background:var(--card);color:var(--ac);border:2px solid var(--ac);padding:6px 14px;font-size:1.3rem;font-weight:700}
.chipx.on{background:var(--ac);color:var(--bg)}
.chipx small,.sl small.n{font-size:.7rem}
.selbar{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 14px;min-height:60px}
.selbar small{display:block;color:var(--ac)}
.stg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.sb{background:var(--card);color:var(--fg);border:1px solid var(--ln);text-align:start;padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:.95rem}
.sb.pl{border-color:var(--ac)}
.sb i{margin-inline-start:auto;font-style:normal;font-weight:700;color:var(--bg);background:var(--ac);border-radius:8px;padding:0 9px}
.ex{margin-top:10px;color:var(--mu)}
.res div{padding:5px 10px;border-radius:8px;margin:4px 0;background:var(--card);border:1px solid var(--ln)}
.res .ok{border-color:var(--ok)}
.res .bd{border-color:var(--no)}
.sr2{display:flex;gap:6px;justify-content:center;margin:6px 0}
.sl{flex:1;min-width:0;height:clamp(74px,12vh,140px);background:var(--card);color:var(--fg);border:2px dashed var(--ln);padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sl.f{border:2px solid var(--ac)}
.sl.bd{border-color:var(--no);background:#c6282820}
.sl b{font-size:1.5rem;color:var(--ac)}
.sl small{font-size:.65rem;line-height:1.1}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.pc{background:var(--card);color:var(--fg);border:2px solid var(--ln);padding:8px 10px;width:clamp(150px,44vw,300px);text-align:start}
.pc.on{border-color:var(--ac);outline:3px solid var(--ac)}
.pc small{display:block;font-size:.85rem;line-height:1.5}
.pi{width:clamp(48px,8vh,90px);height:clamp(48px,8vh,90px);border-radius:50%;margin:auto;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.9rem}
.tm{text-align:center;color:var(--ac);font-size:1.4rem}
.ph{font-size:2.2rem;color:var(--ac);font-weight:700;text-align:center;margin:10px 0}
.cd{background:var(--card);border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.pic{height:130px;background:radial-gradient(#fff,#e8cf9a);display:flex;align-items:center;justify-content:center;font-size:4rem}
.bd{padding:10px 14px}
.op{display:block;width:100%;background:var(--card);color:var(--fg);border:2px solid var(--ln);margin:8px 0;text-align:start;font-size:1rem}
.op.ok{border-color:var(--ok);background:#2e7d3222}
.op.bd{border-color:var(--no);background:#c6282822}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.tile{display:flex;align-items:center;gap:14px;width:100%;margin:10px 0;padding:16px;background:var(--card);color:var(--fg);border:2px solid var(--ln);text-align:start}
.te{font-size:2.6rem}
.tt b{display:block;color:var(--ac);font-size:1.3rem}
.tt small{display:block;color:var(--mu);font-size:.9rem;line-height:1.4}
.tt i{display:block;font-style:normal;font-size:.85rem;margin-top:4px;color:var(--ac)}
@media(min-width:900px){.tile{flex-direction:column;text-align:center;justify-content:center;min-height:30vh}.tile .te{font-size:min(10vh,4.5rem)}}
@media(max-width:480px){.stg{grid-template-columns:1fr}}
.cd,.op,.res,.selbar{max-width:1000px;margin-inline:auto}
</style>
</head>
<body>
<div id="hd"></div>
<div id="a"></div>
<script>
// ==== بيانات اللعبة: [عنوان المرحلة، شرح، المرجع، نص الآية] ====
const D=[
["لا تتسرع في التعليم","تحذير من التسابق على منصب التعليم، لأن المعلم يُحاسَب أكثر.","يع ٣: ١","لا تكونوا معلمين كثيرين يا إخوتي، عالمين أننا نأخذ دينونة أعظم."],
["من يضبط لسانه فهو كامل","كلنا نتعثر، والذي يضبط كلامه يقدر أن يضبط باقي جسده.","يع ٣: ٢","لأننا في أشياء كثيرة نعثر جميعنا. إن كان أحد لا يعثر في الكلام فذاك رجل كامل، قادر أن يلجم كل الجسد أيضا."],
["اللسان مثل اللجام","قطعة صغيرة في فم الحصان القوي تجعله يطيع راكبه.","يع ٣: ٣","هوذا الخيل، نضع اللجم في أفواهها لكي تطاوعنا، فنُدير جسمها كله."],
["اللسان مثل دفة السفينة","سفينة ضخمة تدفعها رياح عاصفة، ومع ذلك يوجّهها شيء صغير جدا في يد القبطان.","يع ٣: ٤","هوذا السفن أيضا، وهي عظيمة بهذا المقدار، وتسوقها رياح عاصفة، تديرها دفة صغيرة جدا إلى حيثما شاء قصد المدير."],
["اللسان مثل الشرارة","عضو صغير يفتخر بتأثيره الكبير، كعود ثقاب صغير يحرق غابة.","يع ٣: ٥","هكذا اللسان أيضا، هو عضو صغير ويفتخر متعظما. هوذا نار قليلة، أي وقود تحرق!"],
["اللسان نار وعالم الإثم","مصدرها شرير، تلوّث الإنسان كله وتشعل دائرة حياته، وأصل الكلمة وادي هنوم.","يع ٣: ٦","فاللسان نار! عالم الإثم. هكذا جعل في أعضائنا اللسان، الذي يدنس الجسم كله، ويضرم دائرة الكون، ويضرم من جهنم."],
["الإنسان يروّض الحيوانات","الإنسان بذكائه يروّض الأسود والطيور والزواحف والأسماك.","يع ٣: ٧","لأن كل طبع للوحوش والطيور والزحافات والبحريات يذلل، وقد تذلل للطبع البشري."],
["اللسان لا يستطيع أحد أن يذلله","لا قدرة بشرية تروّضه وحدها، ويحتاج إلى نعمة الله.","يع ٣: ٨","وأما اللسان فلا يستطيع أحد من الناس أن يذلله. هو شر لا يضبط، مملوء سما مميتا."],
["تناقض عجيب","في الكنيسة نسبّح الله، وبعد الخروج نشتم من خلقهم على صورته.","يع ٣: ٩","به نبارك الله الآب، وبه نلعن الناس الذين قد تكونوا على شبه الله."],
["بركة ولعنة من فم واحد","كلام طيب وكلام جارح يخرجان من نفس الفم، وهذا لا يليق بالمؤمن.","يع ٣: ١٠","من الفم الواحد تخرج بركة ولعنة. لا يصلح يا إخوتي أن تكون هذه الأمور هكذا."],
["الينبوع الواحد","سؤال استنكاري: هل تخرج من عين واحدة مياه حلوة ومرة معا؟","يع ٣: ١١","ألعل ينبوعا ينبع من نفس عين واحدة العذب والمر؟"],
["الشجرة تثمر حسب طبيعتها","كل شجرة تثمر حسب طبيعتها، وكذلك أولاد الله يتكلمون بالبركة.","يع ٣: ١٢","هل تقدر يا إخوتي تينة أن تصنع زيتونا، أو كرمة تينا؟ ولا كذلك ينبوع يصنع ماء مالحا وعذبا."],
["الحكمة تظهر في التصرف","من يرى نفسه حكيما يثبت ذلك بسلوكه وهدوء قلبه، لا بكثرة الجدال.","يع ٣: ١٣","من هو حكيم وعالم بينكم، فليرِ أعماله بالتصرف الحسن في وداعة الحكمة."],
["غيرة مرة وتحزب","الحسد والتعصب والانقسام في القلب يجعل ادعاء الحكمة كذبا.","يع ٣: ١٤","ولكن، إن كان لكم غيرة مرة وتحزب في قلوبكم، فلا تفتخروا وتكذبوا على الحق."],
["ثلاث صفات للحكمة الأرضية","حكمة من العالم والذات والشيطان وليست من الله، وقد تبدو دينية.","يع ٣: ١٥","ليست هذه الحكمة نازلة من فوق، بل هي أرضية نفسانية شيطانية."],
["ثمرة الغيرة والتحزب","حيث تسود الأنانية والانقسام تكثر الفوضى والمشاكل والشرور.","يع ٣: ١٦","لأنه، حيث الغيرة والتحزب، هناك التشويش وكل أمر رديء."],
["الحكمة التي من فوق","ثماني صفات للحكمة التي يمنحها الله لمن يطلبها بإيمان، أولها الطهارة.","يع ٣: ١٧","وأما الحكمة التي من فوق فهي أولا طاهرة، ثم مسالمة، مترفقة، مذعنة، ممتلئة رحمة وأثمارا صالحة، عديمة الريب والرياء."],
["ثمر البر يزرع في السلام","الحياة المقدسة والأعمال الصالحة يزرعها صانعو السلام.","يع ٣: ١٨","وثمر البر يزرع في السلام من الذين يفعلون السلام."]
];
const IMG=["👨‍🏫","🙊","🐎","⛵","🔥","⚠️","🦁","🐍","🙏","🔁","💧","🌳","💡","😠","🌍","⚡","🕊️","🌱"];
// كلمة السر: حرف لكل مرحلة بالترتيب (١٨ حرف)
const W=[...'منيضبطلسانهفهوكامل'],N=18;
const lab=W.map((c,k)=>W.filter(x=>x==c).length>1?c+'<small>'+'١٢'[W.slice(0,k+1).filter(x=>x==c).length-1]+'</small>':c);
// شريحتان مزيفتان (من خارج الأصحاح)
const FAKE=[["الرب راعيّ فلا يعوزني شيء.","مز ٢٣: ١"],["لأنه هكذا أحب الله العالم حتى بذل ابنه الوحيد.","يو ٣: ١٦"]];
const SL=[...D.map((d,i)=>({t:'s',i,v:d[3],r:d[2],l:lab[i]})),...FAKE.map((f,k)=>({t:'f',i:k,v:f[0],r:f[1],l:['ث','ج'][k]}))];

// ==== الأدوات ====
const $=x=>document.getElementById(x),sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a},rg=n=>[...Array(n).keys()];
let ST={pts:0,round:''},BEST={};
try{BEST=JSON.parse(localStorage.getItem('jm-best')||'{}')}catch(e){}
const fs=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
const FSB='<button class="g" onclick="fs()">⛶</button>';
const hdr=()=>{$('hd').innerHTML=ST.round?`<button class="g" onclick="hub()">☰ القائمة</button><b>${ST.round}</b><span>⭐ ${ST.pts}</span>${FSB}`:`<b>صيد الآيات</b>${FSB}`};
const sv=k=>{BEST[k]=Math.max(BEST[k]??-9,ST.pts);try{localStorage.setItem('jm-best',JSON.stringify(BEST))}catch(e){}};
const GO=['mt()','tl()','r3()'],btns=k=>`<div class="row"><button onclick="${GO[k]}">العب تاني</button><button class="g" onclick="hub()">القائمة</button></div>`;
const show=h=>{$('a').innerHTML=h;hdr();scrollTo(0,0)};
function hub(){
  clearInterval(ST.ti);ST={pts:0,round:''};
  const T=[['🔍','١. مطابقة الشرائح','طابق ٢٠ شريحة بمراحل الأصحاح، واكتشف الشريحتين المزيفتين',22],['⏳','٢. الخط الزمني','رتّب آيات الأصحاح بسرعة، واكتشف كلمة السر',6],['📖','٣. اختار الآية','خمس مراحل، لكل مرحلة اختار آيتها الصح',5]];
  show(`<div class="ctr" style="padding-top:0"><div class="big" style="font-size:min(11vh,4.5rem)">🗣️</div><h1 style="font-size:min(7vh,2.4rem)">صيد الآيات</h1><p class="sub">يعقوب ٣ — إزاي تبقى إنت اللي سايق؟ اختار الجولة اللي تلعبها</p></div><div class="tiles">${T.map((t,k)=>`<button class="tile" onclick="${GO[k]}"><span class="te">${t[0]}</span><span class="tt"><b>${t[1]}</b><small>${t[2]}</small><i>${BEST[k]===undefined?'لم تُلعب بعد':'أفضل نتيجة: '+BEST[k]+' من '+t[3]}</i></span></button>`).join('')}</div>`)
}

// ==== الجولة ١: مطابقة الشرائح ====
function mt(){ST={pts:0,round:'١. مطابقة الشرائح'};ST.s=sh(SL);ST.pl={};ST.ex=[];ST.sel=null;ST.fr=rg(N+2);ST.so=sh(rg(N));rm()}
function rm(){
  const{fr,sel}=ST;
  show(`<p class="sub">اختر شريحة ثم اضغط على المرحلة اللي تناسب آيتها. لو الآية مش من يعقوب ٣ اضغط 🚫</p><div class="tray">${fr.map(k=>`<button class="chipx${k===sel?' on':''}" onclick="pk(${k})">${ST.s[k].l}</button>`).join('')}</div><div class="selbar">${sel===null?'لم تختر شريحة بعد':`«${ST.s[sel].v}»<small>${ST.s[sel].r}</small>`}</div><div class="row"><button class="g" onclick="exc()">🚫 مش من الأصحاح</button></div><div class="stg">${ST.so.map(i=>`<button class="sb${ST.pl[i]!==undefined?' pl':''}" onclick="pt(${i})">${D[i][0]}${ST.pl[i]!==undefined?`<i>${ST.s[ST.pl[i]].l}</i>`:''}</button>`).join('')}</div>${ST.ex.length?`<div class="ex">المستبعدة: ${ST.ex.map(k=>`<button class="chipx" onclick="un(${k})">${ST.s[k].l} ↩</button>`).join(' ')}</div>`:''}<div class="row"><button ${fr.length?'disabled':''} onclick="ck()">تصحيح ✓</button></div>`)
}
const pk=k=>{ST.sel=ST.sel===k?null:k;rm()};
function pt(i){
  if(ST.sel!==null){if(ST.pl[i]!==undefined)ST.fr.push(ST.pl[i]);ST.pl[i]=ST.sel;ST.fr=ST.fr.filter(x=>x!=ST.sel);ST.sel=null}
  else if(ST.pl[i]!==undefined){ST.fr.push(ST.pl[i]);delete ST.pl[i]}
  rm()
}
function exc(){if(ST.sel===null)return;ST.ex.push(ST.sel);ST.fr=ST.fr.filter(x=>x!=ST.sel);ST.sel=null;rm()}
function un(k){ST.ex=ST.ex.filter(x=>x!=k);ST.fr.push(k);rm()}
function ck(){
  let c=0;
  const rows=rg(N).map(i=>{const s=ST.s[ST.pl[i]],ok=s&&s.t=='s'&&s.i==i;if(ok)c++;return `<div class="${ok?'ok':'bd'}">${ok?'✅':'❌'} ${D[i][0]}${ok?'':` — الصح: ${D[i][2]}`}</div>`}).join('');
  const f=ST.ex.filter(k=>ST.s[k].t=='f').length;
  ST.pts+=c+2*f;sv(0);
  show(`<div class="res"><h2>نتيجة المطابقة: ${c} من ${N}</h2>${rows}<div class="${f==2?'ok':'bd'}">${f==2?'✅':'❌'} الشرائح المزيفة: ${FAKE.map(x=>x[1]).join(' و ')} — اكتشفت ${f} من ٢ (+${2*f})</div></div>${btns(0)}`)
}

// ==== الجولة ٢: الخط الزمني وكلمة السر ====
function tl(){
  clearInterval(ST.ti);ST={pts:0,round:'٢. الخط الزمني'};
  ST.sl=Array(N).fill(null);ST.pool=sh(rg(N));ST.pc=null;ST.t0=Date.now();ST.bad=null;rt();
  ST.ti=setInterval(()=>{const e=$('tm');e&&(e.textContent='⏱ '+(((Date.now()-ST.t0)/1000)|0)+' ث')},500)
}
function rt(){
  show(`<p class="sub">رتّب الآيات من أول الأصحاح لآخره: اختر كارت ثم اضغط مكانه. الحروف هتكوّن كلمة السر!</p><div class="tm" id="tm"></div>${[[0,6],[6,12],[12,18]].map(([a,b])=>`<div class="sr2">${ST.sl.slice(a,b).map((c,j)=>{const k=a+j;return `<button class="sl${c!==null?' f':''}${ST.bad&&ST.bad.includes(k)?' bd':''}" onclick="sk(${k})">${c!==null?`<b>${lab[c]}</b><small>${D[c][3].split(' ').slice(0,3).join(' ')}…</small>`:`<b>${k+1}</b>`}</button>`}).join('')}</div>`).join('')}<div class="pool">${ST.pool.map(i=>`<button class="pc${ST.pc===i?' on':''}" onclick="pc(${i})"><small>${D[i][3]}</small></button>`).join('')}</div><div class="row"><button ${ST.pool.length?'disabled':''} onclick="ct()">تحقق ✓</button></div>`)
}
function pc(i){ST.pc=ST.pc===i?null:i;rt()}
function sk(k){
  if(ST.bad)return;
  if(ST.pc!==null){if(ST.sl[k]!==null)ST.pool.push(ST.sl[k]);ST.sl[k]=ST.pc;ST.pool=ST.pool.filter(x=>x!=ST.pc);ST.pc=null}
  else if(ST.sl[k]!==null){ST.pool.push(ST.sl[k]);ST.sl[k]=null}
  rt()
}
function ct(){
  const bad=rg(N).filter(k=>ST.sl[k]!==k);
  if(bad.length){ST.pts--;ST.bad=bad;rt();setTimeout(()=>{bad.forEach(k=>{ST.pool.push(ST.sl[k]);ST.sl[k]=null});ST.bad=null;rt()},1800);return}
  clearInterval(ST.ti);
  const s=(Date.now()-ST.t0)/1000,b=s<=240?3:s<=360?2:1;
  ST.pts+=b;sv(1);
  const o=sh(['يع ٣: ٢','يع ١: ٢٦','مز ١٤١: ٣']);
  show(`<p class="sub">🎉 الترتيب صح! (+${b}) وظهرت كلمة السر:</p><div class="ph">من يضبط لسانه فهو كامل</div><p class="sub">سؤال بونص (+٣): الجملة دي من أنهي آية؟</p>${o.map(x=>`<button class="op" onclick="qz(this,'${x}')">${x}</button>`).join('')}`)
}
function qz(e,x){
  const ok=x=='يع ٣: ٢';
  if(ok)ST.pts+=3;
  e.className='op '+(ok?'ok':'bd');
  document.querySelectorAll('.op').forEach(b=>b.disabled=true);
  $('a').insertAdjacentHTML('beforeend',`<p class="sub">${ok?'صح!':'الصح: يع ٣: ٢'} «${D[1][3]}»</p>${btns(1)}`);
  sv(1);hdr()
}

// ==== الجولة ٣: اختار الآية ====
function r3(){ST={pts:0,round:'٣. اختار الآية'};ST.q=sh(rg(N)).slice(0,5);ST.qi=0;qa()}
function qa(){
  const i=ST.q[ST.qi],o=sh([i,...sh(rg(N).filter(x=>x!=i)).slice(0,2)]);
  show(`<p class="sub">المرحلة ${ST.qi+1} من ٥</p><div class="cd"><div class="pic">${IMG[i]}</div><div class="bd">${D[i][1]}</div></div><p class="sub">اختر الآية المناسبة لها (+١):</p>${o.map(x=>`<button class="op" onclick="an(this,${x},${i})">${D[x][3]}</button>`).join('')}`)
}
function an(e,x,i){
  const ok=x==i;
  if(ok)ST.pts++;
  document.querySelectorAll('.op').forEach(b=>b.disabled=true);
  e.className='op '+(ok?'ok':'bd');
  $('a').insertAdjacentHTML('beforeend',`<p class="sub">${ok?'صح!':'الصح:'} ${D[i][0]} — ${D[i][2]}</p><div class="row"><button onclick="nq()">${ST.qi<4?'التالي ←':'النهاية 🎉'}</button></div>`);
  hdr()
}
function nq(){ST.qi++;ST.qi<5?qa():fin()}
function fin(){
  sv(2);
  show(`<div class="ctr"><div class="big">🎉</div><h1>${ST.pts} من ٥</h1><div class="vs">«${D[9][3]}»<b>${D[9][2]} — آية الحفظ</b></div>${btns(2)}</div>`)
}

hub();
</script>
</body>
